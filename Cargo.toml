[workspace]
members = [
  "crates/elysium-compiler-core",
  "crates/elysium-compiler-cli",
]
resolver = "2"

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/your-org/elysium-compiler"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.0"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8.22"
rmp-serde = "1.3"
image = { version = "0.25.8", default-features = false, features = ["png", "webp"] }
sha2 = "0.10"
tempfile = "3.10"
fs2 = "0.4"
elysium-compiler-core = { path = "crates/elysium-compiler-core" }
