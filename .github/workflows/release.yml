name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  artifacts:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: elysium-compiler-${{ matrix.target }}
          path: release/${{ matrix.target }}/*
